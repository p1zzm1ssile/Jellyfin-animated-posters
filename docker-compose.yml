services:
  library-cover-maker:
    image: ghcr.io/p1zzm1ssile/library-cover-maker:latest
    container_name: library-cover-maker
    ports:
      - "8097:8097"
    volumes:
      # Your media, read-only. Map as many folders as you like under /media.
      - /path/to/media:/media:ro
    environment:
      # Optional: your Jellyfin address, so the page can send covers and posters straight to it.
      # Leave it out to only download them.
      - JELLYFIN_URL=http://192.168.1.10:8096
    restart: unless-stopped
